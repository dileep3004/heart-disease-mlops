[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops-assignment"
version = "1.0.0"
description = "End-to-end MLOps assignment for the UCI Heart Disease dataset"
requires-python = ">=3.10"
authors = [{name = "Assignment Project"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]
